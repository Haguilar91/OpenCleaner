# Builds every app on GitHub's machines and runs the Linux tests.
#   push to main / pull request / "Run workflow": build + test, files kept as artifacts for 14 days
#   push a tag v1.4.0:                            the same, then a DRAFT release with every file and
#                                                 SHA256SUMS.txt (publish it by hand after checking)
# Android: the APKs must be signed with the same key as earlier releases, or Android refuses the update.
# That key is the repository secret ANDROID_SIGNING_KEYSTORE (base64 of the keystore); see docs/ci.md.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # SHA-256 of the certificate that signed the 1.2 and 1.3 APKs (public, not a secret)
  ANDROID_CERT_SHA256: ccffce5a0a27b7ef3c1abc3c53f2effd82f82a6790690749dd2f8b4cb97f8a48

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that every app has the same version (and the tag's, on a release)
        run: |
          tag=""
          if [ "$IS_RELEASE" = true ]; then tag="$GITHUB_REF_NAME"; fi
          echo "version=$(python3 .github/scripts/versions.py "$tag")" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, name: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, name: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Single-file build (Debian 12 container)
        run: ARCHS=${{ matrix.arch }} sh linux-cachyos/build_release_docker.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: dist/release-${{ needs.version.outputs.version }}/opencleaner-*-linux-${{ matrix.name }}
          retention-days: 14

  linux-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, distros: "debian12 debian13 ubuntu fedora rocky arch-x86", gui: debian12 }
          - { runner: ubuntu-24.04-arm, distros: "arch", gui: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Distro logic (apt, dnf, pacman in containers)
        run: sh linux-cachyos/tests/run_docker_tests.sh ${{ matrix.distros }}
      - name: Real window under Xvfb (oldest GTK the app supports)
        if: matrix.gui != ''
        run: sh linux-cachyos/tests/run_docker_gui.sh ${{ matrix.gui }}
      - name: Logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tests-${{ matrix.runner }}
          path: linux-cachyos/tests/out/
          retention-days: 7

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenCleaner.app
        run: cd macos && ./build_app.sh
      - name: Zip
        run: |
          mkdir -p out
          (cd macos/build && ditto -c -k --keepParent OpenCleaner.app "../../out/OpenCleaner-${{ needs.version.outputs.version }}-macOS.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/
          retention-days: 14

  windows:
    needs: version
    strategy:
      matrix:
        arch: [x64, arm64, x86]
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: WinUI app and installer
        shell: cmd
        run: call installer\build_installer.bat ${{ matrix.arch }} %V%
      - name: WinForms portable exe
        if: matrix.arch == 'x64'
        shell: cmd
        run: call windows\build.bat
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\OpenCleaner-Setup-${{ matrix.arch }}.exe" "out\OpenCleaner-$env:V-Setup-${{ matrix.arch }}.exe"
          if ("${{ matrix.arch }}" -eq "x64") { Copy-Item "windows\OpenCleaner.exe" "out\OpenCleaner-$env:V-Windows-portable.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signing key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "OPENCLEANER_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass android | grep "SHA-256"
          elif [ "$IS_RELEASE" = true ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE is not set: a release APK signed with another key could not update the installed app."
            exit 1
          else
            echo "::warning::ANDROID_SIGNING_KEYSTORE is not set: these test APKs use a throwaway key and cannot update an installed app."
          fi
      - name: Phone and TV APKs
        working-directory: android
        run: gradle assemblePhoneDebug assembleTvDebug --no-daemon
      - name: Collect and check the signature
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/phone/debug/app-phone-debug.apk "out/OpenCleaner-$V-android.apk"
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk "out/OpenCleaner-$V-androidtv.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in out/*.apk; do
            cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
            echo "$apk signed by $cert"
            if [ "$cert" != "$ANDROID_CERT_SHA256" ] && [ -n "$KEYSTORE" ]; then
              echo "::error::$apk is not signed with the release key"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, linux-tests, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'OpenCleaner-*' -o -name 'opencleaner-*' \) -exec cp {} dist/ \;
          cd dist
          chmod +x opencleaner-*-linux-* || true
          sha256sum OpenCleaner-* opencleaner-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          count=$(wc -l < SHA256SUMS.txt)
          [ "$count" -eq 10 ] || { echo "::error::expected 10 files, got $count"; exit 1; }
      - name: Draft release
        run: |
          notes="docs/releases/$V.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "OpenCleaner $V" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "OpenCleaner $V" --generate-notes
          fi
          echo "Draft release ready: check it, then publish it on GitHub." >> "$GITHUB_STEP_SUMMARY"
